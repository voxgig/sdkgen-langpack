# Generates the dart, haskell and lean SDKs from this pack, builds each with
# its own toolchain, and runs the suite it ships. build.yml runs on Node alone,
# so a template that breaks a generated SDK stays green there.

name: sdks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # An sdkgen release is not a push here; see build.yml.
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: ${{ matrix.target }} SDK

    strategy:
      fail-fast: false
      matrix:
        target: [dart, haskell, lean]

    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Install
        run: npm install --no-audit --no-fund

      # The published scaffold, which supplies a project's corpus and its
      # per-entity test data.
      - name: Fetch create-sdkgen
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          TGZ="$(npm pack --silent @voxgig/create-sdkgen)"
          tar -xzf "$TGZ"
          echo "CREATE_SDKGEN=$RUNNER_TEMP/package" >> "$GITHUB_ENV"
          node -p "'@voxgig/create-sdkgen ' + require('./package/package.json').version"

      - name: Report what is installed
        run: |
          node -p "['@voxgig/sdkgen','@voxgig/apidef','@voxgig/struct'].map(n=>n+' '+require(n+'/package.json').version).join('\n')"

      - name: Generate
        run: npm run sdks -- generate "$RUNNER_TEMP/sdk"

      - name: Install dart
        if: ${{ matrix.target == 'dart' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          URL=https://storage.googleapis.com/dart-archive/channels/stable/release/latest/sdk/dartsdk-linux-x64-release.zip
          curl -fsSL -o dartsdk-linux-x64-release.zip "$URL"
          curl -fsSL "$URL.sha256sum" | sha256sum -c -
          unzip -q dartsdk-linux-x64-release.zip
          echo "$RUNNER_TEMP/dart-sdk/bin" >> "$GITHUB_PATH"
          dart-sdk/bin/dart --version

      # The generated library needs only boot packages, so any ghc builds it.
      - name: Install ghc
        if: ${{ matrix.target == 'haskell' }}
        run: |
          set -euo pipefail
          if ! command -v ghc >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q ghc
          fi
          ghc --version

      # The release the generated lean-toolchain pins, unpacked where `run`
      # selects it from.
      - name: Install lean
        if: ${{ matrix.target == 'lean' }}
        run: |
          set -euo pipefail
          echo "LEAN_TOOLCHAINS=$RUNNER_TEMP/lean-toolchains" >> "$GITHUB_ENV"
          LEAN_TOOLCHAINS="$RUNNER_TEMP/lean-toolchains" npm run sdks -- install lean "$RUNNER_TEMP/sdk"

      - name: Build and run the ${{ matrix.target }} suite
        id: suite
        run: npm run sdks -- run ${{ matrix.target }} "$RUNNER_TEMP/sdk"

      # Tells a failure this change brings from one the base branch has too:
      # the same steps, with the base branch's targets and manifest, each SDK
      # under the toolchain it pins, and a verdict naming both.
      - name: Run the base branch's ${{ matrix.target }} SDK
        if: ${{ failure() && steps.suite.outcome == 'failure' && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.base_ref }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE"
          rm -rf .sdk
          git checkout FETCH_HEAD -- .sdk sdkgen-package.json
          if npm run sdks -- generate "$RUNNER_TEMP/base"; then
            npm run sdks -- compare "$TARGET" "$RUNNER_TEMP/sdk" "$RUNNER_TEMP/base" "$BASE"
          else
            echo "::warning::the $TARGET SDK fails on $BASE as well: $BASE does not generate it"
          fi
